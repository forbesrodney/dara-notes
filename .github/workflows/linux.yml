name: Linux packages
# Builds the Linux desktop app as .deb (Debian, Ubuntu) and .rpm (Fedora, openSUSE) packages,
# for x86-64 and ARM64. The packages bundle JavaFX's native code and a Java runtime, so each
# is built on its own architecture. Run it from the Actions tab; the packages are attached to
# the run as "linux-x64" and "linux-arm64".
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Bump deliberately.
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # Fails if gradle-wrapper.jar isn't a genuine Gradle release (before anything runs it).
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # jpackage uses dpkg-deb (preinstalled) and rpmbuild for the packages.
      - name: Install rpm
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      # The Gradle wrapper downloads Gradle (~130 MB, from GitHub release assets) in one try and
      # gives up on a stall. curl retries, resumes partial downloads and drops stalled transfers;
      # the wrapper then installs from the local file and checks distributionSha256Sum.
      - name: Download Gradle
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$props" | sed 's/\\:/:/g')
          zip="$RUNNER_TEMP/$(basename "$url")"
          curl -fL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 \
            --speed-limit 50000 --speed-time 30 -C - -o "$zip" "$url"
          sed -i.bak "s|^distributionUrl=.*|distributionUrl=file\\://$zip|" "$props" && rm "$props.bak"
          ./gradlew --version
      - name: Build the packages
        # The bundled Java runtime is made from the Temurin 21 set up above.
        run: ./gradlew --no-daemon :desktopApp:packageDeb :desktopApp:packageRpm -Pdaranotes.packagingJdk="$JAVA_HOME"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/rpm/*.rpm
          if-no-files-found: error

name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Bump deliberately.
    runs-on: ubuntu-24.04
    steps:
      # Node 24 action versions: GitHub removed Node 20 from its runners on 2026-09-23.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Build and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with:
          name: foam-for-android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

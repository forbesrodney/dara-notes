name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Bump deliberately.
    runs-on: ubuntu-24.04
    steps:
      # Node 24 action versions (Node 20 actions are deprecated on GitHub's runners).
      - uses: actions/checkout@v7
      # Fails if gradle-wrapper.jar isn't a genuine Gradle release (before anything runs it).
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v4
      # The Gradle wrapper downloads Gradle (~130 MB, from GitHub release assets) in one try and
      # gives up on a stall. curl retries, resumes partial downloads and drops stalled transfers;
      # the wrapper then installs from the local file and checks distributionSha256Sum.
      - name: Download Gradle
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$props" | sed 's/\\:/:/g')
          zip="$RUNNER_TEMP/$(basename "$url")"
          curl -fL --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 30 \
            --speed-limit 50000 --speed-time 30 -C - -o "$zip" "$url"
          sed -i.bak "s|^distributionUrl=.*|distributionUrl=file\\://$zip|" "$props" && rm "$props.bak"
          ./gradlew --version
      - name: Build and run unit tests
        run: ./gradlew --no-daemon assembleDebug :desktopApp:compileKotlin :shared:jvmTest testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with:
          name: daranotes-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            androidApp/build/reports/tests/
          if-no-files-found: ignore

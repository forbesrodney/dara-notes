# cspell:disable

# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
# Heavily modified - started with keepachangelog, removed merge commits, removed
#   duplicates, modified the header, added a commit-preprocessor to remove
#   emojis, rewrote the commit-parsers
[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/#getting-started
header = """
# CHANGELOG

All notable changes to this project will be documented in this file.

The format is loosely based on both the [Keep a Changelog](https://keepachangelog.com/) and [Conventional Commits](https://www.conventionalcommits.org/) specifications, and adheres to [Semantic Versioning](https://semver.org/).

---

"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
#    - {% if commit.scope %}({{ commit.scope }}) {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
body = """
{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
  ## [Unreleased]
{% endif -%}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
  ### {{ group | upper_first }}
  {% for commit in commits | unique(attribute="message") %}
    - {% if commit.breaking %}BREAKING CHANGE: {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
  {% endfor %}
{% endfor %}\n
"""
#    - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\

# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
footer = """
{% for release in releases -%}
  {% if release.version and release.previous and release.previous.version -%}
    [{{ release.version | trim_start_matches(pat="v") }}]: \
      https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
        /compare/{{ release.previous.version }}..{{ release.version }}
  {% elif release.version -%}
    [{{ release.version | trim_start_matches(pat="v") }}]: \
      https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
        /tree/{{ release.version }}
  {% elif release.previous and release.previous.version -%}
    [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
      /compare/{{ release.previous.version }}..HEAD
  {% endif -%}
{% endfor -%}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[git]
commit_preprocessors = [
  # Remove gitmoji, both actual UTF emoji and :emoji:
  { pattern = ' *(:\w+:|[\p{Emoji_Presentation}\p{Extended_Pictographic}](?:\u{FE0F})?\u{200D}?) *', replace = "" },

  # Strip out Signed-off-by lines entirely. (?m) makes ^ and $ match at each line;
  # without it they only match the start and end of the whole message.
  { pattern = '(?m)^Signed-off-by:.*$', replace = "" },

  # Clean up trailing blank lines left behind by the removal
  { pattern = '\s+$', replace = "" }
]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
  # order - Added, Fixed, Changed, Removed, Security, Deprecated
  #         Documentation, Testing, Support, Other
  # Skip routine maintenance messages
  { message = "^build", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },

  # A few long forms for existing types just to be thorough
  { message = "^feature", group = "<!-- 0 -->Added" },
  { message = "^performance", group = "<!-- 2 -->Changed" },
  { message = "^documentation", group = "<!-- 6 -->Documentation" },
  # A few new types to fill in the gaps, keep rewrite rules to a minimum
  { message = "^changed", group = "<!-- 2 -->Changed" },
  { message = "^removed", group = "<!-- 3 -->Removed" },
  { message = "^security", group = "<!-- 4 -->Security" },
  { message = "^deprecated", group = "<!-- 5 -->Deprecated" },
  # A few rule rewrites
  # { message = "^fix\\(security\\)", group = "<!-- 4 -->Security" },
  # { message = "^feat\\(docs\\)", group = "<!-- 6 -->Documentation" },

  # { message = "^fix\\(removed{0,1}\\)", group = "<!-- 3 -->Removed"},
  # { message = "^fix.*removed{0,1}", group = "<!-- 3 -->Removed"},
  # { message = "^fix\\(deprecated{0,1}\\)", group = "<!-- 5 -->Deprecated"},
  # { message = "^fix.*deprecated{0,1}", group = "<!-- 5 -->Deprecated"},

  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  #{ message = "^style", group = "<!-- 2 -->Changed" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^test", group = "<!-- 7 -->Testing" },
  #{ message = "^chore", group = "<!-- 8 -->Support" },
  #{ message = "^build", group = "<!-- 8 -->Support" },
  #{ message = "^ci", group = "<!-- 8 -->Support" },

  # Catch-all for anything that slips through,
  # should only be stuff that doesn't conform to conventional commits
  { message = ".*", group = "<!-- 9 -->Other" },
]
# Prevent commits that are breaking from being excluded by commit parsers.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"

# (Optional) Remote integration configurations
# can also use --github-repo argument or GITHUB_REPO environment variable
# can also use --github-token argument or GITHUB_TOKEN environment variable
# [remote.github]
# owner = "forbesrodney"
# repo = "macOS_Development_using_Python"
# token = ""
